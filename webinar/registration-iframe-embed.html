<!-- ============ PART 1 — add to <style>, after the .btn-register rule ============ -->
<style>
/* ============ ZOOM REGISTRATION EMBED ============ */
.register-card.is-zoom {
    padding: 18px;
}

    --zoom-frame-h: 720px;
    border: 1px solid var(--border-light);

<!-- ============ PART 3 — replaces lines 1232-1255 ============ -->
<div class="register-card is-zoom">

<!-- ==========================================================================
     NOTES

     Why it goes INSIDE .register-card, not next to it
       The placeholder .zoom-form sat as a sibling of .register-card inside
       .hero-inner, which is `grid-template-columns: 1.3fr 0.9fr`. Uncommented
       as-is it becomes a third grid item and drops to row 2 / column 1, under
       the headline. Putting the iframe inside the card keeps the grid at two
       items and keeps the card's border, radius and shadow around the form.

     Why the dummy form goes
       Its handler is `onsubmit="event.preventDefault();"` — it collects nothing
       and posts nowhere. Left in, the card shows two "Register Now" forms and
       only one of them works.

     The scroll target still works
       The bottom CTA at line 1572 calls
       `document.querySelector('.register-card').scrollIntoView(...)`.
       The wrapper above keeps the `register-card` class, so that still resolves.

     scrolling="no" was dropped on purpose
       Zoom's registration page is taller than any fixed height and varies with
       the webinar description. `scrolling="no"` clips whatever overflows and
       there is no way to reach it. Default (auto) scrolls inside the frame.

     --zoom-frame-h
       One number, three places. Set it to whatever makes the Submit button sit
       just inside the frame on your content — the scrollbar covers the rest.

     Framing is allowed — verified, not assumed
       curl -sSI https://zoom.us/webinar/register/WN__HkL4D8sT7mpqa2tIYJkaw
       returns no X-Frame-Options, and the Content-Security-Policy carries no
       frame-ancestors directive. Nothing blocks the embed.

     The one real risk: third-party cookies
       Zoom sets its session cookies (cred, _zm_ssid, _zm_page_auth) with no
       SameSite attribute, so browsers treat them as SameSite=Lax. In a
       cross-site iframe those are restricted — Safari blocks them outright,
       Chrome under tracking protection does too. The form still renders; the
       failure, when it comes, is on submit. That is what the fallback link is
       for, and why it should stay visible rather than being hidden behind an
       error state.

     Optional — give the form more room on desktop
       The card is ~380px of usable width, which puts Zoom into its mobile
       layout. If it feels cramped, widen the hero column (line 270):
           .hero-inner { grid-template-columns: 1.3fr 0.9fr; }  ->  1fr 1fr;
     ========================================================================== -->
