<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Kotak research PDF → HTML converter</title>
<style>/*__APP_CSS__*/</style>
</head>
<body>
<div class="a-wrap">
  <header class="a-head">
    <span class="a-brand"><span class="a-mark"></span>kotak <b>neo</b></span>
    <span class="a-tag">Research PDF → HTML</span>
  </header>

  <div class="a-drop" id="drop" tabindex="0" role="button" aria-label="Choose a research PDF, or drop one here">
    <h1>Drop a research PDF here</h1>
    <p>Nothing is uploaded. The PDF is read inside this page, on your machine.</p>
    <button class="a-btn" id="pick" type="button">Choose PDF</button>
    <input id="file" type="file" accept="application/pdf,.pdf" class="a-hide">
  </div>

  <div id="status" class="a-status a-hide" role="status" aria-live="polite"></div>
  <div id="meta" class="a-meta a-hide"></div>

  <div id="actions" class="a-actions a-hide">
    <button class="a-btn" id="dl" type="button">Download HTML</button>
    <button class="a-btn ghost" id="cp" type="button">Copy embed fragment</button>
    <button class="a-btn ghost" id="dj" type="button">Download JSON</button>
  </div>

  <div id="out" class="a-out a-hide"><iframe id="frame" title="Rendered report" sandbox="allow-same-origin"></iframe></div>

  <details class="a-json a-hide" id="jsonbox">
    <summary>Extracted data</summary>
    <pre id="json"></pre>
  </details>
</div>

<script>window.__KOTAK_WORKER_B64 = /*__WORKER__*/;</script>
<script>/*__BOT__*/</script>
<script>/*__APP__*/</script>
</body>
</html>
